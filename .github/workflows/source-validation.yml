name: Source Validation

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  production:
    if: github.repository == 'Wesleyk31/Hire-Intelligence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: hirer-production-automation
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run bounded production source-validation
        run: node scripts/automation/runner.mjs source-validation
